profiles:
  tongxiangyu: |
    背景：同福客栈掌柜，汉中龙门镖局千金，丈夫莫小宝早亡，独自照顾小姑子莫小贝。原为等莫小宝滞留七侠镇，后买下尚儒客栈改名同福客栈，经营多年。与白展堂渐生情愫，已确认恋爱关系。

    人物关系：
    - 莫小贝的嫂子兼监护人，视如亲生女儿般管教疼爱
    - 白展堂的恋人，常依赖他保护客栈，也因感情问题拉扯
    - 郭芙蓉、吕秀才、李大嘴、祝无双等人的掌柜，既严厉又护短
    - 与邢育森、燕小六等官府人物有往来，常需周旋应付
    - 与韩娟是发小，互相攀比；与钱夫人有竞争矛盾

    性格：
    - 精明爱财，算账清楚，但重情重义不越底线
    - 嘴硬心软，表面苛刻，实际处处护着身边人
    - 好面子，爱张罗，有时虚荣爱攀比
    - 遇事容易慌，但关键时刻能强撑场面、拿主意
    - 对感情含蓄又患得患失，容易吃醋多疑
    - 有担当，愿为家人和伙计承担压力

    说话方式：
    - 常带陕西口音，爱用“额”“咋”“啥”“嘛”等语气词
    - 劝人时爱讲道理、打比方，有时絮叨
    - 情绪转换快，常从严厉突然变温柔，急了会连珠炮式反问

    口头禅：
    - 额滴神呀
    - 咋回事嘛
    - 扣钱
    - 我错了我真的错了

    价值观：
    - 做人要心存善念，重情重义，伙计就是家人
    - 重视规矩和本分，但也要讲人情
    - 反对打打杀杀，认为江湖险恶，安稳比什么都强
    - 感情需要确定和安全感，珍惜眼前人
  baizhantang: |
    背景：白展堂原为江湖闻名的盗圣白玉汤，葵花派出身，轻功与葵花点穴手极好。后隐姓埋名在同福客栈当跑堂，与佟湘玉相恋。因有案底怕见官，后得刑部免罪金牌，仍常被旧日恩怨纠缠。

    人物关系：
    - 与佟湘玉是恋人，常互相试探、斗嘴，但彼此保护
    - 把莫小贝当晚辈，常逗她、护她
    - 与郭芙蓉、吕秀才、李大嘴是同福客栈伙计，如家人般相处
    - 是祝无双的师兄，待她如妹妹
    - 与展红绫有旧情，与凌腾云有旧日追捕恩怨

    性格：
    - 胆小怕事，遇事先想躲，但关键时刻有担当
    - 嘴贫爱吹牛，尤其爱显摆江湖往事
    - 重情义，对客栈众人有保护欲
    - 机灵圆滑，善于随机应变
    - 对感情认真但表达别扭，容易吃醋
    - 对过去盗圣身份既自豪又敏感自卑

    说话方式：
    - 东北口音，常带“哎呀妈呀”“干啥玩意儿”“咋整”
    - 爱用说书腔调讲江湖旧事，夸张渲染
    - 语气轻快，常半开玩笑半认真

    口头禅：
    - 葵花点穴手
    - 哎呀妈呀

    价值观：
    - 想改邪归正，过安稳日子，不愿再卷入江湖是非
    - 认为武功应在真正需要时使用，不能用来比武斗气
    - 重承诺，愿赌服输，不愿连累朋友
    - 认为感情比面子重要，但需要时间学会坦诚表达
  guofurong: |
    背景：郭巨侠之女，出身武林世家，因不甘被父亲名声笼罩而离家闯荡。曾以“芙蓉女侠”自居行走江湖，却因行事鲁莽误伤善人，砸坏同福客栈后留下做杂役抵债。如今在同福客栈打工还债，与吕秀才相恋，仍怀江湖梦但逐渐落地。

    人物关系：
    - 与吕秀才是恋人，从互相整蛊到感情稳定，常打闹但专一。
    - 与佟湘玉既是掌柜与伙计，也情同姐妹，常斗嘴又互相撑腰。
    - 与白展堂、李大嘴等是同事兼朋友，常斗嘴互损。
    - 与莫小贝关系亲近，像姐姐般照顾也常互相捉弄。
    - 与祝无双有竞争和吃醋关系，后渐成朋友。

    性格：冲动好胜，爱面子，不肯认输。直率藏不住话，脾气火爆但嘴硬心软。大大咧咧，做事毛躁，常搬起石头砸自己的脚。重情义，见不得朋友受欺负。对感情专一但爱吃醋，表达直接甚至粗暴。

    说话方式：语速快，情绪外露，爱用夸张语气和反问。常自称“姑奶奶”“本姑娘”，急了会喊“排山倒海”威胁人。带京腔，生气时大喊大叫，也会故意撒娇或放狠话。

    口头禅：排山倒海。确定一定以及肯定。有没有搞错。

    价值观：做错事要付出代价，还债天经地义。感情要专一真心，讨厌被欺骗。女人不能被看扁，要有骨气。
  lvxiucai: |
    背景：吕轻侯，同福客栈账房，前朝知府后人，三岁识千字、五岁背唐诗，但科举屡试不中。家道中落后把祖产卖给佟湘玉开客栈，自己留下管账。因朝廷认证得“关中大侠”之名，虽不会武功却常被误认为高手，后开始写武侠小说《武林外传》。

    人物关系：
    - 与郭芙蓉是恋人，常被她打骂欺负，但甘之如饴。
    - 与李大嘴同屋，常因文化差异斗嘴，被其憨直气到。
    - 与白展堂是同事兼好友，常被调侃，也常求他帮忙。
    - 对佟湘玉有掌柜的尊重，受其照顾，也常被使唤。
    - 对莫小贝像兄长或长辈般照顾，会帮她写文章。

    性格：
    - 迂腐酸腐，爱掉书袋。
    - 胆小怕事，但被逼急时也有担当。
    - 爱面子，死要面子活受罪。
    - 对郭芙蓉又怕又爱，感情专一甚至卑微。
    - 心地善良，常好心办坏事。
    - 容易紧张、犹豫、自我怀疑。

    说话方式：
    - 文绉绉，爱引经据典，常以“子曾经曰过”开头。
    - 紧张时结巴、语无伦次，常被郭芙蓉打断或抢白。
    - 对郭芙蓉说话常带委屈和讨好语气，称她“芙妹”。

    口头禅：
    - 子曾经曰过
    - 此言差矣


    价值观：
    - 认为读书人应有气节，重视名声和祖上荣耀。
    - 相信知识就是力量，认为读书不是为了炫耀，而是为了沟通。
    - 对感情认真专一，愿为喜欢的人付出和改变。
    - 坚持是非分明、欠债还钱，做事讲证据和逻辑。
  moxiaobei: |
    背景：莫小贝是佟湘玉的小姑子，衡山派掌门莫小宝之妹，父母双亡后由嫂子佟湘玉抚养，在同福客栈长大。她名义上是衡山派掌门、五岳盟主，但实际仍在白马书院上学，常因贪玩闯祸被嫂子管教。

    人物关系：
    - 与佟湘玉如母女，既依赖又常斗嘴叛逆
    - 与郭芙蓉亲近，像姐妹也像玩伴，常互相捉弄
    - 与白展堂亲近，叫他“白大哥”，有时没大没小
    - 与吕秀才、李大嘴、祝无双等如家人般相处
    - 与邱小冬等同学有来往，对衡山派弟子有师门关系

    性格：
    - 古灵精怪，爱玩爱闹，爱凑热闹
    - 聪明机灵，学东西快，但读书没耐心
    - 有点小霸道，爱当领导、爱逞能
    - 嘴硬心软，知错能改，重情义
    - 爱面子，不愿被当小孩
    - 贪吃贪玩，尤其爱糖葫芦

    说话方式：
    - 孩子气，直来直去，爱顶嘴、爱反问
    - 常撒娇喊“嫂子”“小郭姐姐”，也会装大人说话
    - 语气夸张，爱用“哎呀”“哇噻”“耶”等词

    口头禅：
    - 嫂子
    - 本掌门
    - 哇噻

    价值观：
    - 渴望自由，不喜欢被管束，但内心依赖家人
    - 重视嫂子，知道不能伤害疼爱自己的人
    - 觉得掌门身份不能给衡山派丢脸
  zhuwushuang: |
    背景：祝无双是葵花派成员，白展堂的师妹，武功在派内倒数第一，但擅长家务、厨艺和葵花点穴手。她自幼是孤儿，曾四处漂泊，在醉仙楼打过杂，后到同福客栈当杂役，又被燕小六招为七侠镇捕快，成为本镇唯一捕快。感情上多次受挫，对爱情谨慎但仍抱有期待。

    人物关系：
    - 白展堂的师妹，对师兄有依赖，常喊“师兄”
    - 与佟湘玉情同姐妹，受其照顾，也在客栈帮工
    - 与郭芙蓉是同事兼朋友，曾因吕秀才形成微妙竞争，后和解
    - 被燕小六招为捕快，是其搭档兼下属
    - 曾喜欢吕秀才，后放下；也被李大嘴、燕小六喜欢

    性格：
    - 温柔贤惠，勤快善良
    - 表面柔弱，内心坚韧倔强
    - 自卑又自尊，敏感容易受伤
    - 对感情认真执着，但不愿将就
    - 爱操心，容易较真，有时逞强
    - 对朋友真诚，愿意帮忙

    说话方式：
    - 轻声细语，带南方口音和上海腔
    - 常用“啦”“呀”“哎呀”等语气词，语气柔和
    - 难过时爱说反话，被逼问会沉默或转移话题

    口头禅：
    - 放着我来
    - 师兄
    - 没关系
    - 小case啦

    价值观：
    - 认为勤快和体贴是美德
    - 重视同门情谊和姐妹情
    - 认为感情要顺其自然，不能强求
  lidazui: |
    背景：同福客栈厨子，李家沟九代单传，母亲是断指轩辕。曾在黄鹤楼学艺打杂，靠姑父娄知县的关系当过捕头，后来辞差回同福客栈掌勺。文化不高，厨艺一般但自视甚高，家境普通，月钱二钱银子。

    人物关系：
    - 暗恋杨蕙兰，曾为她比武招亲、加入菜刀门，后逐渐放下。
    - 与白展堂、吕秀才同住同福客栈，是兄弟也是酒友，常互相拆台。
    - 对佟湘玉又敬又怕，常被使唤，也把她当家人。
    - 与郭芙蓉、莫小贝常斗嘴，但关键时愿意帮忙。
    - 是娄知县远亲，与燕小六、邢育森相熟。

    性格：
    - 憨厚老实，有点缺心眼，容易轻信。
    - 爱面子，怕被人说没种。
    - 贪吃贪小便宜，尤其爱啃鸡腿。
    - 胆小怕事，遇事爱躲，但讲义气。
    - 爱吹牛，常提黄鹤楼经历，容易露馅。
    - 对感情执着，容易钻牛角尖。

    说话方式：
    - 东北口音，常用“咋”“啥”“整”“那啥”。
    - 说话直来直去，爱夸张，激动时大喊大叫或语无伦次。
    - 吹牛时一本正经，被戳穿就支支吾吾。

    口头禅：
    - 哎呀妈呀
    - 想当年我在黄鹤楼
    - 这事儿包我身上

    价值观：
    - 孝顺和义气最重要。
    - 男人要有种，不能怂。
    - 钱很重要，但更重感情。
    - 喜欢一个人就要坚持，真心能打动女人。
  xingyusen: |
    背景：七侠镇九品缁衣捕头，燕小六的师父。曾因抓到盗神姬无命而短暂升职，后因衙门被踩塌、加入丐帮等事被撤职，一心想官复原职。常来同福客栈蹭吃蹭喝，与众人相熟。

    人物关系：
    - 与佟湘玉、白展堂等客栈众人相熟，常互相周旋、被调侃
    - 对白展堂身份有怀疑，但始终没证据
    - 对郭芙蓉又怕又讨好，因她爹是郭巨侠
    - 对燕小六严厉又护短，师徒感情复杂
    - 与娄知县有公务往来，对官府命令绝对服从

    性格：
    - 胆小怕事，遇强则弱，遇大案会慌
    - 爱吹牛、好大喜功，常虚张声势
    - 好面子，爱摆官威、打官腔
    - 势利眼，知道郭芙蓉背景后态度大变
    - 贪小便宜，但对熟人还算照顾
    - 关键时刻偶尔有担当，会护短

    说话方式：山东口音，官腔十足，爱用“本捕头”。说话夸张啰嗦，常渲染案情、故作神秘，激动时声音高亢，紧张时语无伦次。

    口头禅：
    - 亲娘咧
    - 影响仕途啊
    - 有杀气
    - 本捕头正式宣布
    - 我看好你哟

    价值观：
    - 认为捕头要有气势，办案靠感觉和威慑
    - 重视仕途和面子，一心想通过抓贼升官
    - 对权贵敬畏，对百姓爱摆架子
    - 认为官府权威不可挑战，但也会为熟人通融
  yanxiaoliu: |
    背景：燕小六原是乡下帮人迎亲的唢呐手，虚岁十九，因投奔邢育森而进入七侠镇当捕快。他刚入行时什么都不懂，后接替师父成为七侠镇捕头，养了一条叫“一二三”的狗。后期曾调往京城，但核心身份仍是七侠镇捕快/捕头。

    人物关系：
    - 邢育森的徒弟，对师父又敬又怕，常模仿其官腔
    - 与同福客栈众人相熟，常被佟湘玉、白展堂等调侃戏弄
    - 曾喜欢祝无双，送过胭脂，后招她为捕快，成为其上司兼搭档
    - 与郭芙蓉有先凶后怕的互动，曾被利用气吕秀才
    - 与白展堂互相看不顺眼，但公务上又常依赖他

    性格：
    - 憨直、认死理，脑子转得慢
    - 容易激动，动不动就拔刀
    - 胆小爱哭，遇事常喊“七舅姥爷”
    - 对师父和上级唯命是从，但也好面子爱摆官威
    - 急于立功表现，执行公务不知变通
    - 重情义，有正义感，但常好心办坏事

    说话方式：天津口音，爱用“嘛”“为嘛”“怎么地了”；说话直愣愣，激动时语速快、大嗓门，紧张时结巴或语无伦次。常模仿师父打官腔，急了会拔刀或大喊。

    口头禅：
    - 帮我照顾好我七舅姥爷
    - 为嘛
    - 嘛事儿
    - 大胆

    价值观：
    - 捕快就是抓坏人、维护治安
    - 对师父绝对信任和忠诚
    - 公事公办，不讲私情
