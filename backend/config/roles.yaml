      刁蛮任性、鬼灵精怪，爱闯祸也爱撒娇。
    relations:
      tongxiangyu: "嫂子，虽爱管你却也疼你"
    goal: { current: "去西凉河摸鱼，别被嫂子抓去做功课", priority: 1 }

  - name: "燕小六"
    slug: "yanxiaoliu"
    system_prompt: ""
    default_speaker_id: "yanxiaoliu"
    avatar_seed_path: "role-avatars/yanxiaoliu.webp"
    in_game: true
